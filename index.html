<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <title>Disciplinas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="site-header">
    <p class="header-eyebrow">Organize seus estudos</p>
    <h1>Minhas <span class="text-gradient">Disciplinas</span></h1>
  </header>

  <main>
    <p id="erro-index" class="erro" hidden></p>
    <div id="lista-disciplinas"></div>
    <button type="button" id="btn-nova-disciplina" class="btn btn-primary btn-block">
      + Nova disciplina
    </button>
  </main>

  <div id="modal-disciplina" class="modal-overlay">
    <div class="modal">
      <h2>Nova disciplina</h2>
      <form id="form-disciplina">
        <div class="form-group">
          <label for="nome-disciplina">Nome</label>
          <input type="text" id="nome-disciplina" name="nome" placeholder="Ex: Matemática" required>
        </div>
        <div class="actions">
          <button type="button" id="btn-cancelar-disciplina" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <nav class="nav-inferior">
    <div class="nav-inferior-inner">
      <a href="index.html" data-pagina="disciplinas" class="ativo">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Disciplinas
      </a>
      <a href="nova-tarefa.html" data-pagina="tarefas">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tarefas
      </a>
      <a href="cronograma.html" data-pagina="cronograma">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Cronograma
      </a>
    </div>
  </nav>

  <script src="app.js" charset="UTF-8"></script>
  <script>initIndex();</script>
</body>
</html>
