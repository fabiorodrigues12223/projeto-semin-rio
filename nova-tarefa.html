<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <title>Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="site-header">
    <p class="header-eyebrow">Produtividade</p>
    <h1>Suas <span class="text-gradient">Tarefas</span></h1>
  </header>

  <main>
    <p id="erro-tarefa" class="erro" hidden></p>

    <h2 class="secao-titulo">Nova tarefa</h2>
    <form id="form-tarefa">
      <div class="form-group">
        <label for="nome">Nome da tarefa</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Lista de exercícios" required>
      </div>

      <div class="form-group">
        <label for="disciplina">Disciplina</label>
        <select id="disciplina" name="disciplina" required></select>
      </div>

      <div class="form-group">
        <label for="dataEntrega">Data de entrega</label>
        <input type="date" id="dataEntrega" name="dataEntrega" required>
      </div>

      <div class="actions">
        <a href="index.html" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar tarefa</button>
      </div>
    </form>

    <h2 class="secao-titulo">Tarefas cadastradas</h2>
    <div id="lista-tarefas"></div>
  </main>

  <nav class="nav-inferior">
    <div class="nav-inferior-inner">
      <a href="index.html" data-pagina="disciplinas">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Disciplinas
      </a>
      <a href="nova-tarefa.html" data-pagina="tarefas" class="ativo">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tarefas
      </a>
      <a href="cronograma.html" data-pagina="cronograma">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Cronograma
      </a>
    </div>
  </nav>

  <script src="app.js" charset="UTF-8"></script>
  <script>initNovaTarefa();</script>
</body>
</html>
